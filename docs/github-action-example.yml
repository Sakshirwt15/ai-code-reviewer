# MVP trigger WITHOUT running a server: copy this file into the repo you want reviewed
# as .github/workflows/ai-review.yml and add repo secrets ANTHROPIC_API_KEY (or another provider).
name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { repository: YOUR_ORG/ai-code-reviewer, path: bot }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r bot/requirements.txt
      - working-directory: bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: sqlite:///data/reviews.db
        run: python -m app.cli review ${{ github.repository }} ${{ github.event.pull_request.number }}
