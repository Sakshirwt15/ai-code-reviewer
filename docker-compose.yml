services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes: ["./data:/app/data"]
    restart: unless-stopped
  dashboard:
    build:
      context: .
      target: dashboard
    env_file: .env
    ports: ["8501:8501"]
    volumes: ["./data:/app/data"]
    depends_on: [api]
